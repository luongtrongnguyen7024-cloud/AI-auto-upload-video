<style>
  :root {
    --bg-base: #090D16;
    --bg-surface: #0F172A;
    --bg-card: #141E33;
    --bg-card-hover: #1E2D4A;
    --bg-input: #0B1220;
    
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.16);
    --border-focus: #10B981;

    --emerald-400: #34D399;
    --emerald-500: #10B981;
    --emerald-600: #059669;
    --emerald-glow: rgba(16, 185, 129, 0.2);

    --amber-400: #FBBF24;
    --amber-500: #F59E0B;
    --amber-glow: rgba(245, 158, 11, 0.2);

    --rose-500: #EF4444;
    --rose-glow: rgba(239, 68, 68, 0.2);

    --blue-500: #3B82F6;
    --indigo-500: #6366F1;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 25px -5px var(--emerald-glow);
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 50;
  }

  .sidebar-brand {
    padding: 24px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--emerald-500), #064E3B);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
    font-size: 20px;
  }

  .brand-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #FFFFFF, #94A3B8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-badge {
    font-size: 0.68rem;
    font-weight: 600;
    background: rgba(16, 185, 129, 0.15);
    color: var(--emerald-400);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .sidebar-nav {
    flex: 1;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    color: var(--text-secondary);
    border-radius: var(--radius-md);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    transition: var(--transition);
    cursor: pointer;
    border: 1px solid transparent;
  }

  .nav-item:hover {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border);
  }

  .nav-item.active {
    background: rgba(16, 185, 129, 0.12);
    color: var(--emerald-400);
    border-color: rgba(16, 185, 129, 0.3);
    font-weight: 600;
  }

  .nav-badge {
    margin-left: auto;
    background: rgba(245, 158, 11, 0.15);
    color: var(--amber-400);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* MAIN CONTENT */
  .main-wrapper {
    margin-left: 260px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* HEADER */
  .top-header {
    height: 70px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .header-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .page-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status-dot.active {
    background: var(--emerald-500);
    box-shadow: 0 0 8px var(--emerald-500);
  }

  .status-dot.warning {
    background: var(--amber-500);
    box-shadow: 0 0 8px var(--amber-500);
  }

  .status-dot.danger {
    background: var(--rose-500);
    box-shadow: 0 0 8px var(--rose-500);
  }

  /* CONTENT AREA */
  .content-body {
    padding: 32px;
    flex: 1;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
  }

  .tab-pane {
    display: none;
    animation: fadeIn 0.25s ease-out forwards;
  }

  .tab-pane.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: var(--transition);
    text-decoration: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--emerald-500), var(--emerald-600));
    color: #FFFFFF;
    box-shadow: var(--shadow-glow);
  }

  .btn-primary:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border);
  }

  .btn-secondary:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    color: var(--rose-500);
    border-color: rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover {
    background: var(--rose-500);
    color: #FFFFFF;
  }

  .btn-sm {
    padding: 5px 10px;
    font-size: 0.8rem;
    border-radius: var(--radius-sm);
  }

  /* CARDS & GRID */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-card);
    transition: var(--transition);
  }

  .stat-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }

  .stat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
  }

  .stat-value {
    font-size: 1.85rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .stat-desc {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  /* ALERT BOX */
  .alert-box {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .alert-box.danger {
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.3);
  }

  .alert-content {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.92rem;
  }

  .alert-icon {
    font-size: 22px;
  }

  /* SECTION CARDS */
  .panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-card);
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .panel-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .filter-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
  }

  .filter-btn:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
  }

  .filter-btn.active {
    background: var(--emerald-500);
    color: #FFFFFF;
    border-color: var(--emerald-500);
    box-shadow: var(--shadow-glow);
  }

  .search-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: var(--radius-md);
    font-size: 0.88rem;
    outline: none;
    transition: var(--transition);
    min-width: 240px;
  }

  .search-input:focus {
    border-color: var(--emerald-500);
    box-shadow: 0 0 0 2px var(--emerald-glow);
  }

  /* TABLE */
  .table-responsive {
    overflow-x: auto;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    text-align: left;
  }

  .data-table th {
    padding: 12px 16px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .data-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    vertical-align: middle;
  }

  .data-table tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-emerald {
    background: rgba(16, 185, 129, 0.15);
    color: var(--emerald-400);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .badge-amber {
    background: rgba(245, 158, 11, 0.15);
    color: var(--amber-400);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .badge-rose {
    background: rgba(239, 68, 68, 0.15);
    color: var(--rose-500);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .badge-blue {
    background: rgba(59, 130, 246, 0.15);
    color: #60A5FA;
    border: 1px solid rgba(59, 130, 246, 0.3);
  }

  .badge-slate {
    background: rgba(100, 116, 139, 0.15);
    color: var(--text-secondary);
    border: 1px solid rgba(100, 116, 139, 0.3);
  }

  /* UPLOAD DROPZONE */
  .upload-box {
    border: 2px dashed var(--border-hover);
    border-radius: var(--radius-xl);
    padding: 40px 20px;
    text-align: center;
    background: rgba(15, 23, 42, 0.5);
    transition: var(--transition);
    cursor: pointer;
  }

  .upload-box:hover, .upload-box.drag-over {
    border-color: var(--emerald-500);
    background: rgba(16, 185, 129, 0.05);
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-hover);
    border-radius: var(--radius-xl);
    width: 90%;
    max-width: 650px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    transform: scale(0.95);
    transition: var(--transition);
  }

  .modal-overlay.open .modal-card {
    transform: scale(1);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-body {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }

  /* FORM INPUTS */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .form-control {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
    transition: var(--transition);
  }

  .form-control:focus {
    border-color: var(--emerald-500);
    box-shadow: 0 0 0 2px var(--emerald-glow);
  }

  textarea.form-control {
    min-height: 100px;
    resize: vertical;
  }

  /* TOAST NOTIFICATION */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
  }

  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.88rem;
    animation: slideIn 0.3s ease-out forwards;
  }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* SPINNER */
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { width: 70px; }
    .sidebar-brand span, .nav-item span, .brand-badge, .sidebar-footer { display: none; }
    .main-wrapper { margin-left: 70px; }
    .top-header { padding: 0 16px; }
    .content-body { padding: 20px 16px; }
  }
</style>
